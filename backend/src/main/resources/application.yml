spring:
  application:
    name: cidade-em-foco
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cidade_em_foco?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  alerts:
    realtime-connection-timeout: ${ALERT_REALTIME_CONNECTION_TIMEOUT:30m}
    realtime-refresh-interval: ${ALERT_REALTIME_REFRESH_INTERVAL:30s}
    cleanup-interval: ${ALERT_CLEANUP_INTERVAL:5m}
    cleanup-initial-delay: ${ALERT_CLEANUP_INITIAL_DELAY:5m}
  whatsapp:
    queue-sync-interval: ${WHATSAPP_QUEUE_SYNC_INTERVAL:1m}
    queue-sync-initial-delay: ${WHATSAPP_QUEUE_SYNC_INITIAL_DELAY:1m}
    cloud-api:
      enabled: ${WHATSAPP_CLOUD_API_ENABLED:false}
      base-url: ${WHATSAPP_CLOUD_API_BASE_URL:https://graph.facebook.com}
      api-version: ${WHATSAPP_CLOUD_API_VERSION:v23.0}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
      template-name: ${WHATSAPP_TEMPLATE_NAME:cidade_em_foco_alerta_climatico}
      template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:pt_BR}
      timezone: ${WHATSAPP_TIMEZONE:America/Sao_Paulo}
      process-interval: ${WHATSAPP_PROCESS_INTERVAL:30s}
      process-initial-delay: ${WHATSAPP_PROCESS_INITIAL_DELAY:30s}
      max-attempts: ${WHATSAPP_MAX_ATTEMPTS:3}
      batch-size: ${WHATSAPP_BATCH_SIZE:20}
  occurrences:
    resolved-map-visibility: ${RESOLVED_MAP_VISIBILITY:24h}
    temporary-event-lifetime: ${TEMPORARY_EVENT_LIFETIME:6h}
    auto-resolution-interval: ${AUTO_RESOLUTION_INTERVAL:5m}
    auto-resolution-initial-delay: ${AUTO_RESOLUTION_INITIAL_DELAY:5m}
    grouping-window: ${OCCURRENCE_GROUPING_WINDOW:2h}
    grouping-radius-meters: ${OCCURRENCE_GROUPING_RADIUS_METERS:500}
  storage:
    occurrence-images-directory: ${OCCURRENCE_IMAGE_DIR:uploads/occurrences}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
